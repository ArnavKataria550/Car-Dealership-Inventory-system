name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Prettier, ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

  backend:
    name: Backend (typecheck, test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dealership
          POSTGRES_PASSWORD: dealership
          POSTGRES_DB: car_dealership_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealership"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # CI-only values for a throwaway database; nothing here is a real secret.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://dealership:dealership@localhost:5432/car_dealership_test
      TEST_DATABASE_URL: postgresql://dealership:dealership@localhost:5432/car_dealership_test
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      JWT_EXPIRES_IN: 1h

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w backend

      - name: Apply database migrations
        run: npm run db:deploy -w backend

      - name: Typecheck
        run: npm run typecheck -w backend

      - name: Test with coverage
        run: npm run test:coverage -w backend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w frontend

      - name: Test with coverage
        run: npm run test:coverage -w frontend

      - name: Build
        run: npm run build -w frontend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
